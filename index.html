<!doctype html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>23Hertz 交互与动效设计原型</title>
<!--
  23Hertz 完整交互与动效设计原型 · 2026-10-12
  与《23Hertz_完整设计升级与施工规格.md》《23Hertz_Codex一次性施工与严格验收提示词.md》配套。
  单位约定：本文件 1 CSS px = 1 Avalonia DIP（100% 缩放）。所有数值为施工基准值。
  顶部"原型控制条"与右下角提示仅为演示工具，不属于产品界面，禁止搬入 23Hertz。
  所有任务、文件名、耗时、回执均为演示数据，不代表真实执行。
-->
<style>
/* ===================== 1. 设计令牌（唯一取值表，规范区由同一份 TOKENS 生成） ===================== */
:root{
  --canvas:#FAFAF8; --surface:#FFFFFF; --sunken:#F3F3F1;
  --ink:#171717; --ink-2:#3B3B39; --ink-3:#5F5F5B; --ink-4:#6B6B66;
  --line:#E4E4E0; --line-soft:#EDEDEA;
  --hover:#F2F2EF; --selected:#ECECE8; --pressed:#E5E5E1;
  --strong:#141414; --strong-hover:#2B2B2A; --strong-pressed:#000000; --on-strong:#FFFFFF;
  --focus:#2F6FD0;
  --error:#B3352F; --error-soft:#FBEDEB;
  --warning:#8A5A12; --warning-soft:#FAF2E4;
  --success:#2C6B4A;
  --scrim:rgba(20,20,18,.28);
  --shadow-float:0 12px 32px rgba(17,17,15,.10),0 2px 6px rgba(17,17,15,.06);

  --font-ui:"Segoe UI Variable Text","Segoe UI","Microsoft YaHei UI","PingFang SC","Noto Sans SC",system-ui,sans-serif;
  --font-display:"Segoe UI Variable Display","Segoe UI Variable Text","Segoe UI","Microsoft YaHei UI","PingFang SC",system-ui,sans-serif;
  --font-mono:"Cascadia Mono","Cascadia Code",Consolas,"Microsoft YaHei UI",monospace;

  --s1:2px; --s2:4px; --s3:6px; --s4:8px; --s5:12px; --s6:16px; --s7:20px; --s8:24px; --s9:32px; --s10:40px; --s11:48px;
  --r-xs:4px; --r-sm:6px; --r-md:8px; --r-lg:12px; --r-pill:999px;

  --d-instant:80ms; --d-fast:120ms; --d-base:160ms; --d-slow:200ms; --d-panel:240ms;
  --ease-std:cubic-bezier(.2,0,0,1); --ease-exit:cubic-bezier(.4,0,1,1); --ease-emph:cubic-bezier(.2,.8,.2,1);

  --sidebar-w:236px; --reading-max:760px; --panel-w:400px; --hang:28px;
  --icon:16px; --icon-slot:18px; --row-h:40px; --head-h:36px; --time-w:56px; --chev:16px;
  --text-scale:1;
}
:root[data-theme="dark"]{
  --canvas:#141413; --surface:#1C1C1B; --sunken:#232321;
  --ink:#F0F0EC; --ink-2:#D3D3CE; --ink-3:#A6A6A0; --ink-4:#97978F;
  --line:#33332F; --line-soft:#292927;
  --hover:#242422; --selected:#2C2C29; --pressed:#34342F;
  --strong:#EDEDE8; --strong-hover:#FFFFFF; --strong-pressed:#D4D4CE; --on-strong:#141413;
  --focus:#7EB0FF;
  --error:#F08A80; --error-soft:#3A2321;
  --warning:#DDB46F; --warning-soft:#342A1B;
  --success:#84C7A0;
  --scrim:rgba(0,0,0,.52);
  --shadow-float:0 12px 32px rgba(0,0,0,.45),0 2px 6px rgba(0,0,0,.35);
}

/* ===================== 2. 基础 ===================== */
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:#DCDCD8;color:var(--ink);font:400 14px/22px var(--font-ui);-webkit-font-smoothing:antialiased;font-feature-settings:"tnum" 0}
:root[data-theme="dark"] body{background:#0B0B0A}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
input,textarea,select{font:inherit;color:inherit}
svg.i{width:var(--icon);height:var(--icon);flex:none;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round;vector-effect:non-scaling-stroke}
svg.i.s14{width:14px;height:14px} svg.i.s12{width:12px;height:12px} svg.i.s20{width:20px;height:20px}
.num{font-variant-numeric:tabular-nums}
.mono{font-family:var(--font-mono)}
:focus{outline:none}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px;border-radius:var(--r-sm)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
@media (prefers-reduced-motion:reduce){*{animation-duration:1ms!important;animation-iteration-count:1!important;transition-duration:1ms!important}}
:root[data-motion="reduce"] *{animation-duration:1ms!important;animation-iteration-count:1!important;transition-duration:1ms!important}

/* ===================== 3. 原型控制条（仅演示工具，非产品） ===================== */
.proto-bar{position:sticky;top:0;z-index:50;display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center;padding:8px 16px;background:#202020;color:#EDEDE8;font-size:12px;line-height:18px}
.proto-bar b{font-weight:600;color:#fff;margin-right:4px}
.proto-bar .grp{display:flex;align-items:center;gap:4px}
.proto-bar .grp>span{color:#9B9B95;margin-right:2px}
.proto-bar button,.proto-bar select{height:26px;padding:0 9px;border-radius:5px;background:#2E2E2C;color:#EDEDE8;border:1px solid #3A3A37}
.proto-bar button[aria-pressed="true"]{background:#EDEDE8;color:#151515;border-color:#EDEDE8}
.proto-bar button:hover{border-color:#6A6A65}
.proto-bar .note{color:#9B9B95;margin-left:auto}
.stage{padding:20px 16px 48px;display:flex;justify-content:flex-start;overflow-x:auto}
.stage>.win{margin:0 auto}

/* ===================== 4. 应用窗口外壳 ===================== */
.win{--win-w:1440px;width:var(--win-w);height:900px;flex:none;display:grid;grid-template-columns:var(--sidebar-w) minmax(0,1fr) auto;grid-template-rows:minmax(0,1fr);background:var(--canvas);border-radius:10px;overflow:hidden;box-shadow:0 1px 0 rgba(0,0,0,.04),0 20px 60px rgba(0,0,0,.18);position:relative;font-size:calc(14px*var(--text-scale))}
.win[data-w="1280"]{--win-w:1280px;height:800px}
.win[data-w="1024"]{--win-w:1024px;height:768px;--sidebar-w:64px}
.win[data-w="760"]{--win-w:760px;height:820px;--sidebar-w:0px}
.side{background:var(--sunken);border-right:1px solid var(--line-soft);display:flex;flex-direction:column;padding:16px 10px 12px;min-width:0;overflow:hidden}
.win[data-w="760"] .side{display:none}
.side{grid-column:1} #main{grid-column:2} #panel{grid-column:3}
.brand{display:flex;align-items:center;gap:10px;height:32px;padding:0 8px;margin-bottom:12px}
.brand .mark{width:22px;height:22px;border-radius:6px;background:var(--strong);color:var(--on-strong);display:grid;place-items:center}
.brand .mark svg{width:14px;height:14px;stroke-width:1.75}
.brand span{font:600 15px/22px var(--font-display);letter-spacing:-.01em}
.nav{display:flex;flex-direction:column;gap:2px}
.nav button{display:flex;align-items:center;gap:10px;height:36px;padding:0 10px;border-radius:var(--r-md);color:var(--ink-2);transition:background var(--d-fast) var(--ease-std)}
.nav button:hover{background:var(--hover)} .nav button:active{background:var(--pressed)}
.nav button[aria-current="page"]{background:var(--selected);color:var(--ink);font-weight:500}
.nav kbd{margin-left:auto;font:400 12px/18px var(--font-ui);color:var(--ink-4)}
.side h6{margin:20px 10px 6px;font:500 12px/18px var(--font-ui);color:var(--ink-4)}
.recent button{display:block;width:100%;text-align:left;height:34px;padding:0 10px;border-radius:var(--r-md);color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.recent button:hover{background:var(--hover)}
.recent button[aria-current="page"]{background:var(--selected);color:var(--ink)}
.recent .live{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--ink);margin-left:6px;vertical-align:2px}
.side .foot{margin-top:auto;border-top:1px solid var(--line-soft);padding-top:8px}
.win[data-w="1024"] .side{padding:16px 8px}
.win[data-w="1024"] .side .label,.win[data-w="1024"] .side h6,.win[data-w="1024"] .recent,.win[data-w="1024"] .brand span,.win[data-w="1024"] .nav kbd{display:none}
.win[data-w="1024"] .nav button{justify-content:center;padding:0}

.main{display:flex;flex-direction:column;min-width:0;position:relative}
.topbar{height:48px;display:flex;align-items:center;gap:8px;padding:0 16px 0 28px;border-bottom:1px solid transparent}
.topbar h1{font:600 15px/22px var(--font-ui);margin:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.topbar .live-badge{display:inline-flex;align-items:center;gap:6px;color:var(--ink-3);font-size:12px}
.topbar .spacer{flex:1}
.iconbtn{width:32px;height:32px;border-radius:var(--r-md);display:inline-grid;place-items:center;color:var(--ink-3);position:relative;transition:background var(--d-fast) var(--ease-std),color var(--d-fast)}
.iconbtn:hover{background:var(--hover);color:var(--ink)} .iconbtn:active{background:var(--pressed)}
.iconbtn[aria-pressed="true"]{background:var(--selected);color:var(--ink)}
.iconbtn .dot{position:absolute;top:6px;right:6px;width:6px;height:6px;border-radius:50%;background:var(--ink);box-shadow:0 0 0 2px var(--canvas)}
.ctx{display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 10px;border-radius:var(--r-md);color:var(--ink-3);font-size:12px}
.ctx:hover{background:var(--hover)}
.ctx .ring{width:14px;height:14px}

/* ===================== 5. 对话阅读列 ===================== */
.scroll{flex:1;overflow-y:auto;overflow-x:hidden;scroll-behavior:smooth}
.col{max-width:var(--reading-max);margin:0 auto;padding:24px 40px 160px}
.win[data-w="760"] .col{padding:20px 20px 160px}
.msg-user{display:flex;justify-content:flex-end;margin:8px 0 28px}
.msg-user .bubble{max-width:78%;background:var(--sunken);border-radius:var(--r-lg);padding:10px 16px;font-size:calc(15px*var(--text-scale));line-height:calc(24px*var(--text-scale));color:var(--ink);white-space:pre-wrap}
.msg-sys{display:flex;align-items:center;gap:8px;justify-content:center;color:var(--ink-4);font-size:12px;line-height:18px;margin:4px 0 20px}
.msg-sys:before,.msg-sys:after{content:"";height:1px;flex:1;background:var(--line-soft);max-width:120px}
.prose{font-size:calc(16px*var(--text-scale));line-height:calc(28px*var(--text-scale));color:var(--ink)}
.prose p{margin:0 0 12px}
.prose table{border-collapse:collapse;width:100%;margin:8px 0 12px;font-size:calc(14px*var(--text-scale));line-height:calc(22px*var(--text-scale))}
.prose th{text-align:left;font-weight:500;color:var(--ink-3);font-size:12px;border-bottom:1px solid var(--line);padding:6px 12px 6px 0}
.prose td{border-bottom:1px solid var(--line-soft);padding:8px 12px 8px 0;vertical-align:top}
.prose .fileref{display:inline-flex;align-items:center;gap:4px;color:var(--ink);text-decoration:underline;text-decoration-color:var(--line);text-underline-offset:3px}
.prose .fileref:hover{text-decoration-color:var(--ink-3)}
.caret{display:inline-block;width:2px;height:1em;background:var(--ink);vertical-align:-2px;margin-left:1px;animation:caret 1s steps(1) infinite}
@keyframes caret{50%{opacity:0}}
.turn-meta{display:flex;gap:4px;align-items:center;color:var(--ink-4);font-size:12px;margin:-4px 0 28px}

/* ===================== 6. 工作轨迹 Work Trace（执行过程） ===================== */
.trace{margin:0 0 16px calc(-1 * var(--hang));width:calc(100% + var(--hang));position:relative}
.win[data-w="760"] .trace{margin-left:0;width:100%}
.t-head,.t-row{display:grid;grid-template-columns:var(--icon-slot) minmax(0,1fr) minmax(88px,30%) var(--time-w) var(--chev);column-gap:10px;align-items:center;border-radius:var(--r-sm);padding:0 8px 0 0;position:relative;cursor:pointer;text-align:left;width:100%;transition:background var(--d-fast) var(--ease-std)}
.t-head{min-height:var(--head-h);padding-top:6px;padding-bottom:6px}
.t-row{min-height:var(--row-h);padding-top:9px;padding-bottom:9px}
.t-head:hover,.t-row:hover{background:var(--hover)}
.t-head:active,.t-row:active{background:var(--pressed)}
.t-row[aria-expanded="true"],.t-row.selected{background:var(--selected)}
.t-row[aria-expanded="true"]:hover,.t-row.selected:hover{background:var(--pressed)}
.t-row.selected:before,.t-row[aria-expanded="true"]:before{content:"";position:absolute;left:-9px;top:50%;width:2px;height:15px;margin-top:-7.5px;border-radius:1px;background:var(--ink)}
.t-row.flash{animation:flash 900ms var(--ease-std)}
@keyframes flash{0%{background:var(--selected)}100%{background:transparent}}
.t-ico{width:var(--icon-slot);height:var(--icon-slot);display:grid;place-items:center;color:var(--ink-3);position:relative}
.t-head .t-ico{color:var(--ink-2)}
.t-name{min-width:0;display:flex;align-items:baseline;gap:8px;overflow:hidden}
.t-name .v{white-space:nowrap;color:var(--ink);font-size:calc(14px*var(--text-scale));line-height:calc(22px*var(--text-scale))}
.t-name .o{min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--ink-2);font-size:calc(14px*var(--text-scale))}
.t-name .o.code{font:400 calc(12.5px*var(--text-scale))/calc(20px*var(--text-scale)) var(--font-mono);color:var(--ink-3)}
.t-head .t-name .v{font-weight:600;font-size:calc(15px*var(--text-scale))}
.t-row.running .t-name .v{font-weight:500}
.t-res{justify-self:end;text-align:right;display:flex;align-items:center;gap:6px;color:var(--ink-2);font-size:calc(13px*var(--text-scale));line-height:calc(20px*var(--text-scale));min-width:0}
.t-res .val{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.t-res .val.n{font-size:calc(14px*var(--text-scale));font-weight:500;color:var(--ink);font-variant-numeric:tabular-nums}
.t-res.err{color:var(--error)} .t-res.warn{color:var(--warning)} .t-res.mute{color:var(--ink-3)}
.t-head .t-res{color:var(--ink-3);font-size:12px}
.t-time{justify-self:end;color:var(--ink-4);font-size:12px;line-height:18px;font-variant-numeric:tabular-nums;white-space:nowrap}
.t-chev{color:var(--ink-4);display:grid;place-items:center;transition:transform var(--d-fast) var(--ease-std)}
.t-head[aria-expanded="true"] .t-chev,.t-row[aria-expanded="true"] .t-chev{transform:rotate(90deg)}
.t-body{padding-top:2px}
/* 窄轨迹：轨迹宽度 ÷ 文字缩放 ≤ 520 时，结果与时间移到第二行（与 v1.1 断点规则一致，按组件宽度而非窗口判断） */
.trace.tn .t-head,.trace.tn .t-row{grid-template-columns:var(--icon-slot) minmax(0,1fr) auto var(--chev);grid-template-areas:"i n n c" ". r t c";row-gap:2px}
:is(.trace.tn .t-head,.trace.tn .t-row)>.t-ico{grid-area:i;align-self:start;margin-top:2px} :is(.trace.tn .t-head,.trace.tn .t-row)>.t-name{grid-area:n;flex-wrap:wrap;row-gap:0} .trace.tn .t-row .t-name .o{white-space:normal;word-break:break-all}
:is(.trace.tn .t-head,.trace.tn .t-row)>.t-res{grid-area:r;justify-self:start;text-align:left} :is(.trace.tn .t-head,.trace.tn .t-row)>.t-time{grid-area:t} :is(.trace.tn .t-head,.trace.tn .t-row)>.t-chev{grid-area:c}
.trace.tn .t-head .t-name .v{white-space:normal}
.t-row+.t-row,.t-row+.t-detail+.t-row{box-shadow:inset 0 1px 0 var(--line-soft)}
.t-row:hover,.t-row.selected,.t-row[aria-expanded="true"]{box-shadow:none}
.t-row:hover+.t-row,.t-row.selected+.t-row,.t-row[aria-expanded="true"]+.t-detail+.t-row{box-shadow:none}
/* 并行组：图标槽左侧 2px 竖线，仅在同一模型响应批次中真实并行时出现 */
.t-row.par .t-ico:after{content:"";position:absolute;left:-6px;top:-11px;bottom:-11px;width:1px;background:var(--line)}
.t-row.par.first .t-ico:after{top:50%} .t-row.par.last .t-ico:after{bottom:50%}
.t-row.par.first .t-ico:before{content:"并行";position:absolute;left:-34px;top:1px;font-size:10px;color:var(--ink-4);display:none}
/* 思考分隔行 */
.t-think{display:grid;grid-template-columns:var(--icon-slot) minmax(0,1fr) auto;column-gap:10px;align-items:center;min-height:28px;color:var(--ink-3);font-size:12px;line-height:18px;padding-right:8px}
.t-think .t-ico{color:var(--ink-4)}
.t-think button{justify-self:start;color:var(--ink-3);display:inline-flex;align-items:center;gap:4px;border-radius:var(--r-xs);padding:0 2px}
.t-think button:hover{color:var(--ink)}
.t-think-body{margin:0 8px 8px 28px;padding:8px 0 8px 12px;border-left:1px solid var(--line);color:var(--ink-3);font-size:13px;line-height:21px}
/* 旁白 */
.t-narr{margin:6px 8px 6px 28px;color:var(--ink-2);font-size:calc(14px*var(--text-scale));line-height:calc(22px*var(--text-scale))}
/* 计划条 */
.t-plan{display:flex;flex-wrap:wrap;gap:4px 14px;margin:0 8px 6px 28px;font-size:12px;line-height:18px;color:var(--ink-4)}
.t-plan span{display:inline-flex;align-items:center;gap:5px}
.t-plan .cur{color:var(--ink);font-weight:500}
.t-plan .done{color:var(--ink-3)}
/* 原位详情 */
.t-detail{margin:0 8px 6px 28px;padding:6px 0 12px;animation:fadein var(--d-base) var(--ease-std)}
@keyframes fadein{from{opacity:0}to{opacity:1}}
.t-facts{display:flex;flex-wrap:wrap;gap:2px 12px;color:var(--ink-3);font-size:12px;line-height:18px;margin-bottom:8px}
.t-facts b{font-weight:500;color:var(--ink-2)}
.t-text{font-size:calc(13.5px*var(--text-scale));line-height:calc(22px*var(--text-scale));color:var(--ink-2);margin:0 0 8px}
.t-out{font:400 calc(12.5px*var(--text-scale))/calc(20px*var(--text-scale)) var(--font-mono);background:var(--sunken);border-radius:var(--r-sm);padding:10px 12px;max-height:200px;overflow:auto;white-space:pre-wrap;word-break:break-all;color:var(--ink-2);margin:0 0 8px}
.t-acts{display:flex;flex-wrap:wrap;gap:4px 16px}
.lnk{display:inline-flex;align-items:center;gap:6px;height:28px;color:var(--ink-3);font-size:12.5px;border-radius:var(--r-xs);transition:color var(--d-fast)}
.lnk:hover{color:var(--ink)} .lnk:active{color:var(--ink-2)}
/* 就近决策 */
.t-decide{margin:4px 8px 10px 28px;padding:12px 0 14px 16px;border-left:2px solid var(--ink);animation:fadein var(--d-base) var(--ease-std)}
.t-decide.q{border-left-color:var(--ink-3)}
.t-decide h4{margin:0 0 6px;font:600 calc(14px*var(--text-scale))/22px var(--font-ui);color:var(--ink)}
.t-decide dl{display:grid;grid-template-columns:auto 1fr;gap:2px 12px;margin:0 0 10px;font-size:12px;line-height:18px}
.t-decide dt{color:var(--ink-4)} .t-decide dd{margin:0;color:var(--ink-2);word-break:break-all}
.t-decide pre{margin:0 0 12px;font:400 12.5px/20px var(--font-mono);background:var(--sunken);border-radius:var(--r-sm);padding:8px 12px;white-space:pre-wrap;word-break:break-all;color:var(--ink-2);max-height:84px;overflow:auto}
.t-decide .btns{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.t-decide .receipt{display:flex;align-items:center;gap:6px;color:var(--ink-3);font-size:12.5px}
.btn{height:32px;padding:0 14px;border-radius:var(--r-md);font-size:13px;font-weight:500;display:inline-flex;align-items:center;gap:6px;transition:background var(--d-fast) var(--ease-std),border-color var(--d-fast),color var(--d-fast);white-space:nowrap}
.btn.primary{background:var(--strong);color:var(--on-strong)}
.btn.primary:hover{background:var(--strong-hover)} .btn.primary:active{background:var(--strong-pressed)}
.btn.secondary{border:1px solid var(--line);background:var(--surface);color:var(--ink)}
.btn.secondary:hover{border-color:var(--ink-4)} .btn.secondary:active{background:var(--pressed)}
.btn.ghost{color:var(--ink-2);padding:0 8px} .btn.ghost:hover{background:var(--hover);color:var(--ink)}
.btn.danger{background:var(--error);color:#fff}
.btn[disabled],.btn[aria-disabled="true"]{background:var(--selected)!important;color:var(--ink-4)!important;border-color:transparent!important;cursor:not-allowed}
.btn .spin{width:12px;height:12px}
/* 运行环与心跳 */
.spin{width:12px;height:12px;border-radius:50%;border:1.5px solid var(--line);border-top-color:var(--ink-2);animation:spin 1s linear infinite;flex:none}
@keyframes spin{to{transform:rotate(360deg)}}
:root[data-motion="reduce"] .spin{animation:none;border-top-color:var(--ink-2);border-right-color:var(--ink-2)}
.beat{width:6px;height:6px;border-radius:50%;background:var(--ink);opacity:.3;flex:none;transition:opacity 900ms var(--ease-exit)}
.beat.on{opacity:1;transition:opacity 80ms linear}
.beat.stall{background:transparent;box-shadow:inset 0 0 0 1.5px var(--ink-4);opacity:1}
/* 现在行 Now Line */
.now{display:flex;align-items:center;gap:10px;min-height:32px;margin:6px 0 0;padding:0 8px 0 0;color:var(--ink-2);font-size:13px;line-height:20px}
.now .txt{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.now .t{color:var(--ink-4);font-variant-numeric:tabular-nums;font-size:12px}
.now .stalled{color:var(--ink-4);font-size:12px}
.now .go{margin-left:auto}
.trace .now{margin-left:5px}
.col>.now{margin-left:calc(-1*var(--hang) + 5px)}
/* 回合失败条 */
.t-fail{display:grid;grid-template-columns:var(--icon-slot) minmax(0,1fr);column-gap:10px;margin:8px 0 12px;padding-right:8px}
.t-fail .t-ico{color:var(--error)}
.t-fail h5{margin:0;font:500 14px/22px var(--font-ui);color:var(--ink)}
.t-fail p{margin:2px 0 8px;color:var(--ink-3);font-size:12.5px;line-height:20px}
.chip-pending{display:inline-flex;align-items:center;gap:6px;height:24px;padding:0 10px;border-radius:var(--r-pill);background:var(--surface);border:1px solid var(--line);font-size:12px;color:var(--ink-2)}

/* ===================== 7. 输入框（沿用现有结构，仅定义状态） ===================== */
.composer-wrap{position:absolute;left:0;right:0;bottom:0;padding:0 40px 14px;background:linear-gradient(to bottom,transparent,var(--canvas) 28px)}
.win[data-w="760"] .composer-wrap{padding:0 16px 12px}
.composer{max-width:var(--reading-max);margin:0 auto;background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:0 1px 2px rgba(0,0,0,.04);padding:12px 12px 10px 16px;transition:border-color var(--d-fast)}
.composer:focus-within{border-color:var(--ink-4)}
.composer .ph{color:var(--ink-4);min-height:24px;font-size:15px}
.composer .bar{display:flex;align-items:center;gap:8px;margin-top:10px}
.composer .pill{display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 10px;border-radius:var(--r-md);color:var(--ink-2);font-size:12.5px}
.composer .pill:hover{background:var(--hover)}
.composer .model{margin-left:auto;color:var(--ink-3);font-size:12.5px}
.send{width:32px;height:32px;border-radius:50%;background:var(--strong);color:var(--on-strong);display:grid;place-items:center;transition:background var(--d-fast)}
.send:hover{background:var(--strong-hover)}
.send.stop svg{width:10px;height:10px;fill:currentColor;stroke:none}
.send[aria-disabled="true"]{background:var(--selected);color:var(--ink-4)}
.pending-strip{max-width:var(--reading-max);margin:0 auto 8px;display:flex;justify-content:center}
.note-line{text-align:center;color:var(--ink-4);font-size:11.5px;margin-top:6px}

/* ===================== 8. 右侧任务面板 ===================== */
.panel{width:0;overflow:hidden;border-left:1px solid transparent;background:var(--surface);transition:width var(--d-panel) var(--ease-std);display:flex;flex-direction:column}
.panel.open{width:var(--panel-w);border-left-color:var(--line-soft)}
.win[data-w="1024"] .panel.open{width:360px}
.win[data-w="760"] .panel.open{position:absolute;right:0;top:0;bottom:0;width:100%;z-index:20;box-shadow:var(--shadow-float)}
.panel-in{width:var(--panel-w);min-width:0;display:flex;flex-direction:column;height:100%}
.win[data-w="1024"] .panel-in{width:360px}
.win[data-w="760"] .panel-in{width:100%}
.p-tabs{display:flex;align-items:center;gap:2px;height:48px;padding:0 8px 0 12px;border-bottom:1px solid var(--line-soft);flex:none}
.p-tab{height:30px;padding:0 10px;border-radius:var(--r-md);color:var(--ink-3);font-size:13px;position:relative;display:inline-flex;align-items:center;gap:6px}
.p-tab:hover{background:var(--hover);color:var(--ink)}
.p-tab[aria-selected="true"]{color:var(--ink);background:var(--selected);font-weight:500}
.p-tab .n{font-size:11px;color:var(--ink-4);font-variant-numeric:tabular-nums}
.p-body{flex:1;overflow:auto;padding:12px 16px 24px}
.p-sec{margin:0 0 18px}
.p-sec h5{margin:0 0 8px;font:500 12px/18px var(--font-ui);color:var(--ink-4)}
.p-item{display:grid;grid-template-columns:18px minmax(0,1fr) auto;gap:10px;align-items:center;min-height:34px;padding:6px 8px;border-radius:var(--r-sm);cursor:pointer;font-size:13px;color:var(--ink-2)}
.p-item:hover{background:var(--hover)}
.p-item.selected{background:var(--selected);color:var(--ink)}
.p-item .r{color:var(--ink-3);font-size:12px;font-variant-numeric:tabular-nums;white-space:nowrap}
.p-item .r.err{color:var(--error)} .p-item .r.warn{color:var(--warning)}
.p-item .nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.p-rec{border-top:1px solid var(--line-soft);padding-top:12px;margin-top:8px}
.p-rec h4{margin:0 0 4px;font:600 15px/22px var(--font-ui)}
.p-empty{color:var(--ink-4);font-size:12.5px;line-height:20px;padding:16px 8px}
.seg{display:inline-flex;background:var(--sunken);border-radius:var(--r-md);padding:2px;gap:2px}
.seg button{height:26px;padding:0 10px;border-radius:6px;font-size:12.5px;color:var(--ink-3)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}

/* ===================== 9. 定时计划 · 节律 ===================== */
.sch{max-width:1120px;margin:0 auto;padding:28px 40px 64px}
.win[data-w="760"] .sch{padding:20px 20px 64px}
.sch-head{display:flex;align-items:flex-start;gap:16px;margin-bottom:20px}
.sch-head h2{margin:0;font:600 28px/36px var(--font-display);letter-spacing:-.01em}
.sch-head p{margin:2px 0 0;color:var(--ink-3);font-size:13.5px;line-height:20px}
.sch-head .acts{margin-left:auto;display:flex;gap:8px;align-items:center}
/* 今日刻度 */
.ruler-cap{font-size:12px;line-height:18px;color:var(--ink-4);margin:0 0 4px}
.ruler{position:relative;height:72px;margin:0 0 8px;border-top:1px solid var(--line-soft);border-bottom:1px solid var(--line-soft)}
.ruler .lbl{position:absolute;left:0;bottom:4px;font-size:11px;color:var(--ink-4);display:none}
.ruler .axis{position:absolute;left:0;right:0;bottom:22px;height:1px;background:var(--line)}
.ruler .tk{position:absolute;bottom:22px;width:1px;height:5px;background:var(--line)}
.ruler .tl{position:absolute;bottom:4px;transform:translateX(-50%);font-size:11px;color:var(--ink-4);font-variant-numeric:tabular-nums}
.ruler .ev{position:absolute;top:0;bottom:22px;width:12px;margin-left:-6px;cursor:pointer;border-radius:3px}
.ruler .ev i{position:absolute;left:5px;bottom:0;width:2px;height:8px;border-radius:1px;background:var(--ink)}
.ruler .ev.paused i{background:var(--ink-4);height:6px}
.ruler .ev em{position:absolute;left:5.5px;width:1px;bottom:8px;background:var(--line)}
.ruler .ev span{position:absolute;left:6px;font-size:11.5px;line-height:16px;color:var(--ink-2);white-space:nowrap;background:var(--canvas);padding:0 4px;border-radius:3px}
.ruler .ev:hover span{color:var(--ink);background:var(--hover)}
.ruler .ev.paused span{color:var(--ink-4)}
.ruler .nowmk{position:absolute;bottom:14px;width:0;border-left:1.5px solid var(--ink)}
.ruler .nowlbl{position:absolute;font:500 11px/16px var(--font-ui);color:var(--ink);white-space:nowrap;background:var(--canvas);padding:0 4px;border-radius:3px}
.next{display:flex;flex-wrap:wrap;align-items:center;gap:4px 12px;padding:10px 0 18px;color:var(--ink-2);font-size:13.5px}
.next>*{white-space:nowrap}
.next strong{font-weight:600;color:var(--ink)}
.next .pw{margin-left:auto;display:inline-flex;align-items:center;gap:6px;color:var(--ink-3);font-size:12px}
.sch-tabs{display:flex;gap:20px;border-bottom:1px solid var(--line-soft);margin-bottom:8px}
.sch-tabs button{height:36px;color:var(--ink-3);font-size:14px;position:relative}
.sch-tabs button[aria-selected="true"]{color:var(--ink);font-weight:500}
.sch-tabs button[aria-selected="true"]:after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:2px;background:var(--ink);border-radius:1px}
.sch-tabs .n{font-size:12px;color:var(--ink-4);margin-left:4px;font-variant-numeric:tabular-nums}
.sch-grid{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:32px;align-items:start}
.sch-grid.noinsp{grid-template-columns:minmax(0,1fr)}
.win[data-w="1024"] .sch-grid,.win[data-w="760"] .sch-grid{grid-template-columns:minmax(0,1fr)}
.grp-h{display:flex;align-items:center;gap:8px;margin:18px 0 4px;font-size:12px;color:var(--ink-4);font-weight:500}
.grp-h .n{font-variant-numeric:tabular-nums}
.grp-h.attn{color:var(--warning)}
.grp-h button{margin-left:auto;font-size:12px;color:var(--ink-3)}
.plan{display:grid;grid-template-columns:28px minmax(0,1fr) auto;gap:14px;align-items:center;min-height:68px;padding:10px 12px 10px 10px;border-radius:var(--r-md);cursor:pointer;position:relative;transition:background var(--d-fast) var(--ease-std)}
.plan+.plan{box-shadow:inset 0 1px 0 var(--line-soft)}
.plan:hover,.plan.sel{box-shadow:none;background:var(--hover)}
.plan.sel{background:var(--selected)}
.plan.sel:before{content:"";position:absolute;left:-1px;top:50%;margin-top:-8px;width:2px;height:16px;border-radius:1px;background:var(--ink)}
.plan:hover+.plan,.plan.sel+.plan{box-shadow:none}
.plan .nm{font:500 calc(15px*var(--text-scale))/calc(22px*var(--text-scale)) var(--font-ui);color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:flex;align-items:center;gap:8px}
.plan .nm .tag{font:400 11px/16px var(--font-ui);color:var(--ink-3);border:1px solid var(--line);border-radius:var(--r-xs);padding:0 5px;flex:none}
.plan .rule{font-size:calc(13px*var(--text-scale));line-height:calc(20px*var(--text-scale));color:var(--ink-3);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.plan .when{text-align:right;min-width:112px}
.plan .when .a{font:500 calc(14px*var(--text-scale))/calc(20px*var(--text-scale)) var(--font-ui);font-variant-numeric:tabular-nums;color:var(--ink);white-space:nowrap}
.plan .when .b{font-size:calc(12px*var(--text-scale));line-height:calc(18px*var(--text-scale));color:var(--ink-4);white-space:nowrap}
.plan .when .a.warn{color:var(--warning)} .plan .when .a.err{color:var(--error)} .plan .when .a.mute{color:var(--ink-3);font-weight:400}
.plan .hov{position:absolute;right:12px;top:50%;transform:translateY(-50%);display:none;gap:4px;background:inherit;padding-left:12px}
.plan:hover .hov,.plan:focus-within .hov{display:flex}
.plan:hover .when,.plan:focus-within .when{visibility:hidden}
/* 节律标记 cadence glyph */
.cad{width:28px;height:28px;display:grid;place-items:center;color:var(--ink-2)}
.cad .stamp{width:24px;height:26px;border:1.5px solid currentColor;border-radius:5px;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;padding-bottom:2px;position:relative}
.cad .stamp:before{content:"";position:absolute;left:3px;right:3px;top:5px;height:1.5px;background:currentColor;border-radius:1px}
.cad .stamp b{font:600 11px/12px var(--font-ui);font-variant-numeric:tabular-nums}
.cad .week{display:grid;grid-template-columns:repeat(7,3px);gap:1px;align-items:end;height:16px}
.cad .week i{display:block;width:3px;height:3px;border-radius:50%;box-shadow:inset 0 0 0 1px currentColor}
.cad .week i.on{height:12px;border-radius:1.5px;background:currentColor;box-shadow:none}
.cad.paused{color:var(--ink-4)} .cad.attn{color:var(--warning)}
.insp{position:sticky;top:12px;border-left:1px solid var(--line-soft);padding:4px 0 16px 28px;min-height:420px}
.win[data-w="1024"] .insp,.win[data-w="760"] .insp{position:static;border-left:0;padding:0 12px 16px 52px;min-height:0}
.insp h3{margin:0 0 4px;font:600 20px/28px var(--font-display);word-break:break-word}
.insp .st{font-size:13px;line-height:20px;color:var(--ink-3);margin-bottom:14px}
.insp .st.warn{color:var(--warning)} .insp .st.err{color:var(--error)}
.insp .act{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:20px}
.insp h5{margin:18px 0 8px;font:500 12px/18px var(--font-ui);color:var(--ink-4)}
.kv{display:grid;grid-template-columns:72px 1fr;gap:6px 12px;font-size:13px;line-height:20px}
.kv dt{color:var(--ink-4)} .kv dd{margin:0;color:var(--ink-2)}
.instr{font-size:13px;line-height:21px;color:var(--ink-2);white-space:pre-wrap;word-break:break-word;max-height:105px;overflow:hidden;position:relative}
.instr.full{max-height:none}
.instr:not(.full):after{content:"";position:absolute;left:0;right:0;bottom:0;height:28px;background:linear-gradient(to bottom,transparent,var(--canvas))}
.runs{display:flex;flex-direction:column}
.run{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:center;min-height:36px;font-size:13px;color:var(--ink-2);border-radius:var(--r-sm);padding:0 6px;margin:0 -6px;cursor:pointer}
.run:hover{background:var(--hover)}
.run .tm{color:var(--ink-3);font-variant-numeric:tabular-nums;font-size:12.5px;white-space:nowrap}
.run .rs{font-size:12.5px;white-space:nowrap;display:inline-flex;align-items:center;gap:5px}
.rs.ok{color:var(--ink-2)} .rs.err{color:var(--error)} .rs.warn{color:var(--warning)} .rs.mute{color:var(--ink-4)}
.hist{width:100%;border-collapse:collapse;font-size:13px}
.hist th{text-align:left;font-weight:500;font-size:12px;color:var(--ink-4);padding:8px 12px 8px 0;border-bottom:1px solid var(--line-soft)}
.hist td{padding:10px 12px 10px 0;border-bottom:1px solid var(--line-soft);vertical-align:top;color:var(--ink-2)}
.hist tr{cursor:pointer} .hist tbody tr:hover td{background:var(--hover)}
.hist .sub{color:var(--ink-4);font-size:12px}
.filters{display:flex;gap:6px;flex-wrap:wrap;margin:12px 0 4px}
.fchip{height:28px;padding:0 12px;border-radius:var(--r-pill);border:1px solid var(--line);font-size:12.5px;color:var(--ink-2);background:var(--surface)}
.fchip[aria-pressed="true"]{background:var(--strong);color:var(--on-strong);border-color:var(--strong)}
.empty{padding:40px 0 24px;max-width:520px}
.empty h3{margin:0 0 6px;font:600 18px/26px var(--font-ui)}
.empty p{margin:0 0 18px;color:var(--ink-3);font-size:13.5px;line-height:21px}
.tpl{display:grid;gap:8px}
.tpl button{display:grid;grid-template-columns:28px 1fr auto;gap:12px;align-items:center;text-align:left;padding:10px 12px;border:1px solid var(--line-soft);border-radius:var(--r-md);background:var(--surface)}
.tpl button:hover{border-color:var(--line)}
.tpl .t1{font-weight:500;font-size:14px} .tpl .t2{font-size:12.5px;color:var(--ink-3)}
.skel{height:56px;border-radius:var(--r-md);background:var(--sunken);margin:6px 0;animation:skel 1.4s var(--ease-std) infinite}
@keyframes skel{50%{opacity:.55}}
.banner{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:var(--r-md);background:var(--warning-soft);color:var(--ink-2);font-size:13px;margin-bottom:12px}
.banner .i{color:var(--warning)}
/* 抽屉 · 句式编辑器 */
.scrim{position:absolute;inset:0;background:var(--scrim);z-index:30;opacity:0;pointer-events:none;transition:opacity var(--d-slow) var(--ease-std)}
.scrim.on{opacity:1;pointer-events:auto}
.drawer{position:absolute;top:0;right:0;bottom:0;width:540px;max-width:100%;background:var(--surface);z-index:31;box-shadow:var(--shadow-float);transform:translateX(24px);opacity:0;pointer-events:none;transition:transform var(--d-slow) var(--ease-emph),opacity var(--d-slow) var(--ease-std);display:flex;flex-direction:column}
.drawer.on{transform:none;opacity:1;pointer-events:auto}
.dr-h{display:flex;align-items:center;gap:8px;padding:18px 20px 8px 28px}
.dr-h h3{margin:0;font:600 18px/26px var(--font-ui)}
.dr-b{flex:1;overflow:auto;padding:8px 28px 24px}
.dr-f{border-top:1px solid var(--line-soft);padding:12px 20px 14px 28px;display:flex;align-items:center;gap:8px}
.dr-f .pv{flex:1;min-width:0;font-size:12.5px;line-height:18px;color:var(--ink-3)}
.dr-f .pv b{color:var(--ink);font-weight:500}
.nl{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:var(--r-md);padding:0 6px 0 12px;height:44px;background:var(--canvas);transition:border-color var(--d-fast)}
.nl:focus-within{border-color:var(--ink-4)}
.nl input{flex:1;border:0;background:transparent;font-size:14px;height:100%;outline:none}
.nl .hint{font-size:12px;color:var(--ink-4);white-space:nowrap}
.sentence{margin:18px 0 6px;font-size:17px;line-height:40px;color:var(--ink)}
.tok{display:inline-flex;align-items:center;gap:4px;height:32px;padding:0 10px;margin:0 2px;border-radius:var(--r-md);background:var(--sunken);border:1px solid transparent;font:500 16px/30px var(--font-ui);color:var(--ink);vertical-align:1px;transition:background var(--d-fast),border-color var(--d-fast)}
.tok:hover{background:var(--hover);border-color:var(--line)}
.tok[aria-expanded="true"]{background:var(--surface);border-color:var(--ink-4)}
.tok.invalid{border-color:var(--error);color:var(--error)}
.tok .c{width:12px;height:12px;color:var(--ink-4)}
.field{margin:16px 0}
.field label{display:block;font-size:12px;color:var(--ink-4);margin-bottom:6px;font-weight:500}
.field input[type=text],.field textarea{width:100%;border:1px solid var(--line);border-radius:var(--r-md);background:var(--surface);padding:9px 12px;font-size:14px;line-height:22px;resize:vertical;transition:border-color var(--d-fast)}
.field input[type=text]:focus,.field textarea:focus{border-color:var(--ink-4)}
.field .help{font-size:12px;color:var(--ink-4);margin-top:4px}
.field .err{font-size:12px;color:var(--error);margin-top:4px}
.more-h{display:flex;align-items:center;gap:6px;color:var(--ink-3);font-size:13px;height:32px}
.cond{display:grid;gap:10px;padding:4px 0 0 20px}
.sw{display:flex;align-items:flex-start;gap:12px;font-size:13.5px;color:var(--ink-2)}
.sw .sub{display:block;font-size:12px;color:var(--ink-4)}
.toggle{width:32px;height:18px;border-radius:9px;background:var(--line);position:relative;flex:none;margin-top:2px;transition:background var(--d-fast)}
.toggle:after{content:"";position:absolute;left:2px;top:2px;width:14px;height:14px;border-radius:50%;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.2);transition:transform var(--d-fast) var(--ease-std)}
.toggle[aria-checked="true"]{background:var(--strong)}
.toggle[aria-checked="true"]:after{transform:translateX(14px);background:var(--on-strong)}
.pop{position:absolute;z-index:40;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);box-shadow:var(--shadow-float);padding:8px;min-width:220px;animation:popin var(--d-fast) var(--ease-emph)}
@keyframes popin{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:none}}
.pop .opt{display:flex;align-items:center;gap:8px;width:100%;height:34px;padding:0 10px;border-radius:var(--r-sm);font-size:13.5px;color:var(--ink-2);text-align:left}
.pop .opt:hover,.pop .opt.focus{background:var(--hover);color:var(--ink)}
.pop .opt[aria-checked="true"]{color:var(--ink);font-weight:500}
.pop .opt .ck{margin-left:auto;visibility:hidden} .pop .opt[aria-checked="true"] .ck{visibility:visible}
.pop .sep{height:1px;background:var(--line-soft);margin:6px 2px}
.days7{display:flex;gap:4px;padding:6px 4px}
.days7 button{width:30px;height:30px;border-radius:50%;font-size:12.5px;border:1px solid var(--line);color:var(--ink-2)}
.days7 button[aria-pressed="true"]{background:var(--strong);color:var(--on-strong);border-color:var(--strong)}
.cal{padding:4px;width:252px}
.cal .ch{display:flex;align-items:center;justify-content:space-between;height:30px;font-size:13px;font-weight:500;padding:0 4px}
.cal .g{display:grid;grid-template-columns:repeat(7,32px);gap:2px;font-size:12.5px;text-align:center}
.cal .g span{height:24px;line-height:24px;color:var(--ink-4);font-size:11.5px}
.cal .g button{height:32px;border-radius:var(--r-sm);color:var(--ink-2);font-variant-numeric:tabular-nums}
.cal .g button:hover{background:var(--hover)}
.cal .g button[disabled]{color:var(--line);cursor:not-allowed;background:none}
.cal .g button.today{box-shadow:inset 0 0 0 1px var(--line)}
.cal .g button[aria-selected="true"]{background:var(--strong);color:var(--on-strong)}
.times{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;width:252px;max-height:200px;overflow:auto;padding:4px}
.times button{height:30px;border-radius:var(--r-sm);font-size:13px;font-variant-numeric:tabular-nums;color:var(--ink-2)}
.times button:hover{background:var(--hover)}
.times button[aria-selected="true"]{background:var(--strong);color:var(--on-strong)}
.timein{display:flex;align-items:center;gap:6px;padding:6px 4px 8px;border-bottom:1px solid var(--line-soft);margin-bottom:6px}
.timein input{width:72px;height:30px;border:1px solid var(--line);border-radius:var(--r-sm);text-align:center;font-variant-numeric:tabular-nums;background:var(--canvas)}
.dlg{position:absolute;left:50%;top:50%;width:420px;max-width:calc(100% - 32px);transform:translate(-50%,-48%);opacity:0;pointer-events:none;background:var(--surface);border-radius:var(--r-lg);box-shadow:var(--shadow-float);z-index:41;padding:22px 24px 18px;transition:transform var(--d-slow) var(--ease-emph),opacity var(--d-slow) var(--ease-std)}
.dlg.on{transform:translate(-50%,-50%);opacity:1;pointer-events:auto}
.dlg h3{margin:0 0 8px;font:600 17px/24px var(--font-ui)}
.dlg p{margin:0 0 6px;color:var(--ink-2);font-size:13.5px;line-height:21px}
.dlg .btns{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}
.toast{position:absolute;left:50%;bottom:24px;transform:translate(-50%,8px);opacity:0;background:var(--strong);color:var(--on-strong);border-radius:var(--r-md);padding:8px 14px;font-size:13px;z-index:60;transition:opacity var(--d-base) var(--ease-std),transform var(--d-base) var(--ease-std);display:flex;gap:12px;align-items:center;pointer-events:none}
.toast.on{opacity:1;transform:translate(-50%,0);pointer-events:auto}
.toast button{color:var(--on-strong);text-decoration:underline;font-size:12.5px}

/* ===================== 10. 设计规范区 ===================== */
.spec{max-width:1120px;margin:0 auto;padding:28px 40px 80px}
.spec h2{font:600 28px/36px var(--font-display);margin:0 0 4px}
.spec h3{font:600 18px/26px var(--font-ui);margin:36px 0 10px;padding-top:12px;border-top:1px solid var(--line-soft)}
.spec h4{font:600 14px/22px var(--font-ui);margin:18px 0 6px}
.spec p,.spec li{font-size:13.5px;line-height:22px;color:var(--ink-2)}
.spec ul{padding-left:18px;margin:6px 0}
.spec .toc{display:flex;flex-wrap:wrap;gap:6px;margin:14px 0 0}
.spec .toc a{font-size:12.5px;color:var(--ink-2);border:1px solid var(--line);border-radius:var(--r-pill);padding:3px 10px;text-decoration:none}
.spec .toc a:hover{border-color:var(--ink-4)}
.tbl{width:100%;border-collapse:collapse;font-size:12.5px;margin:6px 0 12px}
.tbl th{text-align:left;font-weight:500;color:var(--ink-4);border-bottom:1px solid var(--line);padding:6px 10px 6px 0}
.tbl td{border-bottom:1px solid var(--line-soft);padding:6px 10px 6px 0;vertical-align:top;color:var(--ink-2)}
.tbl code,.spec code{font-family:var(--font-mono);font-size:12px;background:var(--sunken);border-radius:4px;padding:1px 5px;color:var(--ink)}
.sw-col{display:inline-block;width:14px;height:14px;border-radius:3px;vertical-align:-2px;margin-right:6px;box-shadow:inset 0 0 0 1px rgba(0,0,0,.12)}
.icon-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:8px;margin:8px 0}
.icon-cell{border:1px solid var(--line-soft);border-radius:var(--r-md);padding:12px 8px 8px;display:flex;flex-direction:column;align-items:center;gap:8px;background:var(--surface)}
.icon-cell .big{width:72px;height:72px;position:relative;display:grid;place-items:center}
.icon-cell .big svg{width:72px;height:72px;stroke-width:1.5}
.icon-cell .big .kl{position:absolute;inset:0;display:none}
.show-keylines .icon-cell .big .kl{display:block}
.icon-cell .row{display:flex;gap:10px;align-items:center;color:var(--ink)}
.icon-cell span{font-size:11.5px;color:var(--ink-3);text-align:center;line-height:16px}
.anat{position:relative;border:1px dashed var(--line);border-radius:var(--r-md);padding:20px 16px 28px 44px;background:var(--canvas);margin:8px 0 16px}
.anat .m{position:absolute;font:500 10.5px/14px var(--font-mono);color:var(--focus)}
.typo-row{display:grid;grid-template-columns:160px 1fr;gap:16px;align-items:baseline;padding:10px 0;border-bottom:1px solid var(--line-soft)}
.typo-row .meta{font:400 12px/18px var(--font-mono);color:var(--ink-3)}
.motion-demo{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:6px 0 12px}
.box-demo{width:36px;height:36px;border-radius:var(--r-sm);background:var(--strong)}
.acc{columns:2;column-gap:28px}
.acc li{break-inside:avoid;margin-bottom:6px}
.win[data-w="760"] .acc,.win[data-w="1024"] .acc{columns:1}
.legend{display:flex;flex-wrap:wrap;gap:6px 18px;font-size:12px;color:var(--ink-3);margin:6px 0}
.legend span{display:inline-flex;align-items:center;gap:6px}
[hidden]{display:none!important}
</style>
</head>
<body>

<!-- ===================== 原型控制条（演示工具，非产品） ===================== -->
<div class="proto-bar" role="toolbar" aria-label="原型控制条（仅演示）">
  <b>原型控制</b>
  <div class="grp"><span>视图</span>
    <button data-view="conv" aria-pressed="true">对话与执行</button>
    <button data-view="sch" aria-pressed="false">定时计划</button>
    <button data-view="spec" aria-pressed="false">设计规范</button>
  </div>
  <div class="grp" data-for="conv"><span>场景</span>
    <select id="pScenario" aria-label="场景"></select>
    <button id="pPlay" aria-pressed="true">暂停</button>
    <button id="pStep">单步</button>
    <button id="pReset">重播</button>
    <select id="pSpeed" aria-label="速度"><option value="1">1×</option><option value="2" selected>2×</option><option value="4">4×</option></select>
  </div>
  <div class="grp" data-for="conv"><span>推理来源</span>
    <select id="pReason" aria-label="推理来源">
      <option value="private" selected>私有推理流（DeepSeek 类）</option>
      <option value="public">公开思考摘要（Responses 类）</option>
      <option value="none">无推理流</option>
    </select>
  </div>
  <div class="grp" data-for="sch"><span>数据状态</span>
    <select id="pSchState" aria-label="定时计划数据状态"><option value="ok">正常</option><option value="empty">空</option><option value="loading">加载中</option><option value="offline">Host 未连接</option></select>
  </div>
  <div class="grp"><span>窗口</span>
    <select id="pWidth" aria-label="窗口宽度"><option value="1440">1440×900</option><option value="1280">1280×800</option><option value="1024">1024×768</option><option value="760">760（窄窗）</option></select>
  </div>
  <div class="grp"><span>文字</span>
    <select id="pText" aria-label="文字缩放"><option value="1">100%</option><option value="1.25">125%</option><option value="1.5">150%</option><option value="2">200%</option></select>
  </div>
  <div class="grp">
    <button id="pTheme" aria-pressed="false">深色</button>
    <button id="pMotion" aria-pressed="false">减少动态</button>

<div class="stage">
<div class="win" id="win" data-w="1440">
  <!-- 侧栏：沿用现有结构，只规定状态与间距 -->
  <nav class="side" aria-label="主导航">
    <div class="brand"><span class="mark"><svg class="i"><use href="#i-logo"/></svg></span><span>23Hertz</span></div>
    <div class="nav">
      <button data-nav="conv" aria-current="page"><svg class="i"><use href="#i-plus"/></svg><span class="label">新对话</span><kbd>Ctrl N</kbd></button>
      <button data-nav="sch"><svg class="i"><use href="#i-calendar"/></svg><span class="label">定时计划</span></button>
      <button data-nav="search"><svg class="i"><use href="#i-search"/></svg><span class="label">搜索</span></button>
      <button data-nav="cap"><svg class="i"><use href="#i-grid"/></svg><span class="label">能力</span></button>
    </div>
    <h6>最近</h6>
    <div class="recent" id="recent"></div>
    <div class="foot nav">
      <button data-nav="spec"><svg class="i"><use href="#i-sliders"/></svg><span class="label">设置</span></button>
    </div>
  </nav>

  <!-- 主区：三个视图 -->
  <main class="main" id="main">
    <section id="view-conv" class="main" style="height:100%">
      <header class="topbar">
        <h1 id="convTitle">只读测试与计算</h1>
        <span class="live-badge" id="liveBadge" hidden><span class="beat on" id="badgeBeat"></span><span>进行中</span></span>
        <span class="spacer"></span>
        <button class="ctx" title="上下文用量"><svg class="ring" viewBox="0 0 16 16"><circle cx="8" cy="8" r="6" fill="none" stroke="var(--line)" stroke-width="1.5"/><circle cx="8" cy="8" r="6" fill="none" stroke="var(--ink-3)" stroke-width="1.5" stroke-dasharray="1.13 37.7" transform="rotate(-90 8 8)"/></svg>上下文 3%</button>
        <button class="iconbtn" data-ptab="changes" title="文件与改动" aria-label="文件与改动"><svg class="i"><use href="#i-folder"/></svg></button>
        <button class="iconbtn" data-ptab="web" title="网页面板" aria-label="网页面板"><svg class="i"><use href="#i-globe"/></svg></button>
        <button class="iconbtn" id="panelBtn" data-ptab="progress" aria-pressed="false" title="任务面板（Ctrl+.）" aria-label="任务面板"><svg class="i"><use href="#i-panel"/></svg><span class="dot" id="panelDot" hidden></span></button>
      </header>
      <div class="scroll" id="convScroll"><div class="col" id="convCol"></div></div>
      <div class="composer-wrap">
        <div class="pending-strip" id="pendingStrip"></div>
        <div class="composer" role="group" aria-label="输入框（结构沿用现有）">
          <div class="ph" id="composerPh">继续交代下一件事…</div>
          <div class="bar">
            <button class="pill" aria-label="添加"><svg class="i"><use href="#i-plus"/></svg></button>
            <button class="pill"><svg class="i s14"><use href="#i-shield"/></svg>允许修改</button>
            <span class="model">DeepSeek Flash · 思考：自动</span>
            <button class="send" id="sendBtn" aria-label="发送"><svg class="i"><use href="#i-send"/></svg></button>
          </div>
        </div>
        <div class="note-line">任何模型都存在认知边界，重要信息请独立核验</div>
      </div>
    </section>
    <section id="view-sch" class="main" style="height:100%" hidden>
      <div class="scroll" id="schScroll"><div class="sch" id="schRoot"></div></div>
    </section>
    <section id="view-spec" class="main" style="height:100%" hidden>
      <div class="scroll" id="specScroll"><div class="spec" id="specRoot"></div></div>
    </section>
  </main>

  <!-- 右侧任务面板 -->
  <aside class="panel" id="panel" aria-label="任务面板"><div class="panel-in" id="panelIn"></div></aside>

  <!-- 浮层 -->

                         : { dt: 160, e: "end", id, st: "ok", res: `${3 + (i % 4)} 级标题` });

      { dt: 0, e: "answer", blocks: [{ p: "主要风险有两点：变高行会让滚动位置估算漂移；回收容器时必须把展开状态保存在模型里，而不是控件里。" }] },

/* =====================================================================
   4. 执行引擎：脚本 → 事件 → 归并（reducer）→ 局部渲染
   ===================================================================== */
const ENG = { key: "standard", ev: [], i: 0, wait: 0, playing: true, speed: 2, now: 0, block: null, timer: null };
let T = null; // 当前回合

function newTurn(sc) {
  return {
    title: sc.title, user: sc.user, start: 0, entries: [], acts: new Map(), plan: null, decision: null, receipts: {},
    phase: "waiting", think: null, answer: null, done: false, conn: "ok", userWait: 0, waitFrom: null, lastBeat: 0,
    expanded: true, userToggled: false, showAll: false, selected: null, open: null, stopRequested: false, bg: [], endAt: null,
  };
}
function loadScenario(key) {
  ENG.key = key; const sc = SCENARIOS[key];
  ENG.ev = sc.ev; ENG.i = 0; ENG.wait = sc.ev[0]?.dt || 0; ENG.now = 0; ENG.block = null;
  T = newTurn(sc);
  $("#convTitle").textContent = sc.title;
  $("#pScenario").value = key;
  renderRecent();
  CONV.mount(); PANEL.render();
  if (key === "stop") toast("演示提示：读取 Q2 时点击输入框右侧的停止按钮，体验两阶段停止", null, null, 5200);
}
function labelIndex(name) { return ENG.ev.findIndex(x => x.e === "label" && x.name === name); }
function jump(name) { ENG.i = labelIndex(name) + 1; ENG.wait = ENG.ev[ENG.i]?.dt || 0; }

function beat() {
  T.lastBeat = ENG.now;
  for (const el of [$("#nowBeat"), $("#badgeBeat")]) { if (!el) continue; el.classList.remove("stall"); el.classList.add("on"); setTimeout(() => el.classList.remove("on"), 90); }
}

function tick(dt) {
  if (!T) return;
  ENG.now += dt;
  // 后台任务独立于前台回合推进
  for (const b of T.bg) if (!b.doneAt && ENG.now >= b.endAt) { b.doneAt = ENG.now; const a = T.acts.get(b.id); a.status = "ok"; a.result = { text: b.res }; a.end = ENG.now; a.facts = [["运行方式", "后台"], ["产出", b.res]]; CONV.updateAct(a.id); CONV.updateHead(); PANEL.render(); toast(`后台任务完成：${a.obj}`); }
  // 用户等待时间单独累计，不计入执行耗时（B04）
  if (ENG.block && (ENG.block.type === "decide" || ENG.block.type === "sync")) { T.userWait += dt; CONV.updateHead(); CONV.updateNow(); return; }
  // 两阶段停止
  if (T.phase === "stopping" && ENG.now >= T.stopAt) finishStop();
  if (ENG.block?.type === "think") { stepThink(); CONV.updateHead(); CONV.updateNow(); return; }
  if (ENG.block?.type === "answer") { stepAnswer(dt); CONV.updateHead(); CONV.updateNow(); return; }
  if (T.done || T.phase === "stopped" || T.phase === "stopping") { CONV.updateHead(); CONV.updateNow(); for (const a of T.acts.values()) if (a.status === "running") CONV.updateAct(a.id); return; }
  ENG.wait -= dt;
  while (ENG.wait <= 0 && ENG.i < ENG.ev.length && !ENG.block) {
    apply(ENG.ev[ENG.i]); ENG.i++;
    if (ENG.block) break;
    ENG.wait += ENG.ev[ENG.i]?.dt || 0;
  }
  CONV.updateHead(); CONV.updateNow();
  for (const a of T.acts.values()) if (a.status === "running") CONV.updateAct(a.id);
}

function apply(x) {
  const t = T;
  switch (x.e) {
    case "label": break;
    case "goto": ENG.i = labelIndex(x.label); break;
    case "think": {
      const showMs = UI.reason === "none" ? 0 : x.dur;
      const ent = { t: "think", id: "th" + t.entries.length, start: ENG.now, end: null, dur: x.dur, chars: x.chars, summary: x.summary || [], stallAt: x.stallAt, stallFor: x.stallFor || 0, open: false };
      t.think = ent; t.phase = UI.reason === "none" ? "waiting" : "thinking";
      if (showMs) t.entries.push(ent);
      ENG.block = { type: "think" }; beat(); CONV.sync(); break;
    }
    case "narr": t.entries.push({ t: "narr", id: "n" + t.entries.length, text: x.text }); beat(); CONV.sync(); break;
    case "plan": t.plan = x.steps.map(([s, st]) => ({ s, st })); beat(); CONV.sync(); PANEL.render(); break;
    case "start": {
      const a = { id: x.id, kind: x.kind, obj: x.obj, code: !!x.code, cmd: x.cmd, par: x.par || null, status: x.st || "running", start: ENG.now, end: null, result: null, facts: [], text: "", out: "", attempt: x.attempt || 1, child: x.child ? [] : null, lines: 0 };
      t.acts.set(a.id, a); t.entries.push({ t: "act", id: a.id }); t.phase = "tools";
      if (x.bg) t.bg.push({ id: a.id, endAt: ENG.now + x.bg, res: x.bgRes });
      beat(); CONV.sync(); PANEL.render(); break;
    }
    case "status": { const a = t.acts.get(x.id); if (a.status === "waiting" && x.st === "running") a.start = ENG.now; a.status = x.st; beat(); CONV.updateAct(a.id); PANEL.render(); break; }
    case "out": { const a = t.acts.get(x.id); a.lines++; a.out += (a.out ? "\n" : "") + `  已运行 ${a.lines * 12} 项测试…`; beat(); CONV.updateAct(a.id); break; }
    case "child": { const a = t.acts.get(x.id); a.child.push(x.step); a.result = { text: `${a.child.length} 步` }; beat(); CONV.updateAct(a.id); PANEL.render(); break; }
    case "end": {
      const a = t.acts.get(x.id); a.status = x.st; a.end = ENG.now;
      a.result = { text: x.n && /^-?\d+(\.\d+)?$/.test(String(x.res)) ? nf(x.res) : x.res, n: !!x.n };
      if (a.frozenEnd) a.end = a.frozenEnd;
      a.facts = x.facts || []; a.text = x.text || ""; if (x.out) a.out = x.out;
      if (t.decision && t.decision.act === a.id && x.st !== "waiting") { /* 决策已结算，保留回执 */ }
      beat(); CONV.updateAct(a.id); CONV.sync(); PANEL.render(); break;
    }
    case "decide": {
      t.decision = { ...x, state: "open", openedAt: ENG.now };
      ENG.block = { type: "decide" }; t.phase = "awaiting";
      beat(); CONV.sync(); PANEL.render(); CONV.updatePending(); break;
    }
    case "disconnect": {
      t.conn = "lost"; t.phase = "disconnected";
      for (const id of x.unknown) { const a = t.acts.get(id); a.frozenEnd = ENG.now; a.status = "unknown"; a.result = { text: "结果待确认" }; CONV.updateAct(id); }
      ENG.block = { type: "sync", next: x.next }; CONV.sync(); PANEL.render(); break;
    }
    case "answer": t.answer = { blocks: x.blocks, units: x.blocks.reduce((n, b) => n + (b.p ? b.p.length : b.table.length * 12), 0), shown: 0 }; t.phase = "answering"; ENG.block = { type: "answer" }; CONV.sync(); break;
    case "done": t.done = true; t.phase = "done"; t.endAt = ENG.now; if (!t.userToggled) autoCollapse(); CONV.sync(); PANEL.render(); CONV.updatePending(); renderRecent(); break;
  }
}
function stepThink() {
  const th = T.think; const el = ENG.now - th.start;
  const inStall = th.stallAt != null && el >= th.stallAt && el < th.stallAt + th.stallFor;
  if (!inStall && el - (th._lastBeatAt || 0) >= 260) { th._lastBeatAt = el; beat(); }
  if (el >= th.dur + th.stallFor) { th.end = ENG.now; T.think = null; ENG.block = null; T.phase = T.acts.size ? "tools" : "waiting"; ENG.wait = 0; CONV.sync(); }
  else if (el >= 2000 && T.entries.includes(th) && !$(`[data-k="ent-${th.id}"]`)) CONV.sync();
  else CONV.updateThink(th);
}
function stepAnswer(dt) {
  const a = T.answer; a.shown = Math.min(a.units, a.shown + dt * 0.09); if (Math.floor(a.shown) % 7 === 0) beat();
  CONV.updateAnswer();
  if (a.shown >= a.units) { ENG.block = null; ENG.wait = 0; }
}
function autoCollapse() {
  const acts = [...T.acts.values()];
  // 已结束且一般记录超过 6 条时收起；问题行在收起态仍可见（I03）
  if (acts.length > 6) T.expanded = false;
}
function resolveDecision(choice) {
  const d = T.decision; if (!d || d.state !== "open") return;
  d.state = "submitting"; CONV.sync();
  setTimeout(() => {
    d.state = "resolved"; d.choice = choice; d.at = "10:31";
    const act = T.acts.get(d.act); if (act && choice !== "deny") act.start = ENG.now;
    ENG.block = null; T.phase = "tools"; jump(choice === "deny" ? d.deny : d.allow);
    beat(); CONV.sync(); PANEL.render(); CONV.updatePending();
  }, 420 / ENG.speed);
}
function requestStop() {
  if (!T || T.done || T.phase === "stopping" || T.phase === "stopped") return;
  T.phase = "stopping"; T.stopAt = ENG.now + 1600; ENG.block = null; CONV.sync(); toast("已发送停止请求，等待执行器确认");
}
function finishStop() {
  T.phase = "stopped"; T.done = true; T.endAt = ENG.now; T.think = null;
  for (const a of T.acts.values()) if ((a.status === "running" || a.status === "waiting") && !T.bg.some(b => b.id === a.id)) { a.status = "stopped"; a.end = ENG.now; a.result = { text: "已中止" }; }
  if (T.decision?.state === "open") T.decision.state = "cancelled";
  ENG.i = ENG.ev.length; CONV.sync(); PANEL.render(); CONV.updatePending();
}
function syncNow() {
  if (ENG.block?.type !== "sync") return;
  const next = ENG.block.next; T.syncing = true; CONV.sync();
  setTimeout(() => { T.syncing = false; T.conn = "ok"; T.phase = "tools"; ENG.block = null; jump(next); beat(); CONV.sync(); }, 900 / ENG.speed);
}

/* =====================================================================
   5. 对话视图渲染（按 id 局部更新，禁止整组替换）
   ===================================================================== */
const CONV = {
  mount() {
    const col = $("#convCol");
    col.innerHTML = `
      <div class="msg-user"><div class="bubble">${esc(T.user)}</div></div>
      <section class="trace" id="trace" aria-label="工作轨迹">
        <button class="t-head" id="tHead" type="button" aria-expanded="true" aria-controls="tBody"></button>
        <div class="t-plan" id="tPlan" hidden></div>
        <div class="t-body" id="tBody"></div>
        <div class="now" id="now" hidden></div>
      </section>
      <div class="prose" id="answer"></div>
      <div class="turn-meta" id="turnMeta" hidden></div>`;
    $("#tHead").onclick = () => { T.expanded = !T.expanded; T.userToggled = true; CONV.sync(); };
    this.sync();
  },
  /** 计算可见条目：收起成功、不收起问题（I03）；思考/旁白/计划不占名额（B05） */
  visible() {
    const acts = T.entries.filter(e => e.t === "act").map(e => T.acts.get(e.id));
    const imp = a => IMPORTANT.has(a.status) || a.id === T.selected || a.id === T.open || (T.decision && T.decision.act === a.id && T.decision.state !== "resolved");
    const shortThink = e => e.t === "think" && ((e.end ?? ENG.now) - e.start) < 2000;
    if (!T.expanded) return { list: T.entries.filter(e => e.t === "act" && imp(T.acts.get(e.id))), hidden: 0, collapsed: true };
    if (acts.length <= 8 || T.showAll) return { list: T.entries.filter(e => !shortThink(e)), hidden: 0, more: acts.length > 8 };
    const general = acts.filter(a => !imp(a));
    const keepGeneral = new Set(general.slice(-4).map(a => a.id));
    const list = []; let hidden = 0, inserted = false;
    for (const e of T.entries) {
      if (e.t !== "act") { if (!shortThink(e)) list.push(e); continue; }
      const a = T.acts.get(e.id);
      if (imp(a) || keepGeneral.has(a.id)) list.push(e);
      else { hidden++; if (!inserted) { list.push({ t: "more", id: "more" }); inserted = true; } }
    }
    return { list, hidden };
  },
  sync() {
    if (!T) return;
    const trace = $("#trace"), body = $("#tBody");
    const hasActs = T.acts.size > 0;
    const scale = +getComputedStyle($("#win")).getPropertyValue("--text-scale") || 1;
    trace.classList.toggle("tn", trace.getBoundingClientRect().width / scale <= 520);
    trace.hidden = !hasActs && !T.entries.length && T.phase === "done";
    // 无工具时（普通对话）只显示思考行，不显示执行组标题（V-12 / EX-22）
    $("#tHead").hidden = !hasActs;
    const vis = this.visible();
    const want = [];
    for (const e of vis.list) {
      if (e.t === "act") { want.push("row-" + e.id); if (T.open === e.id && !UI.panelOpen) want.push("det-" + e.id); if (T.decision && T.decision.act === e.id) want.push("dec-" + T.decision.id); }
      else want.push("ent-" + e.id);
    }
    if (vis.more !== undefined && vis.more) want.push("ent-less");
    // 按 id 复用已有节点，只增删变化的节点，保持焦点与选区
    const existing = new Map($$(":scope > [data-k]", body).map(n => [n.dataset.k, n]));
    let prev = null;
    for (const k of want) {
      let n = existing.get(k);
      if (!n) n = this.create(k, vis);
      existing.delete(k);
      if (prev ? prev.nextSibling !== n : body.firstChild !== n) body.insertBefore(n, prev ? prev.nextSibling : body.firstChild);
      prev = n;
      this.refresh(k, n, vis);
    }
    for (const n of existing.values()) n.remove();
    this.updateHead(); this.updatePlan(); this.updateNow(); this.updateAnswer(); this.updateMeta(); this.updatePending();
    $("#liveBadge").hidden = T.done;
    $("#sendBtn").classList.toggle("stop", !T.done);
    $("#sendBtn").innerHTML = T.done ? ico("send") : `<svg class="i" viewBox="0 0 24 24" aria-hidden="true"><rect x="6" y="6" width="12" height="12" rx="2"/></svg>`;
    $("#sendBtn").setAttribute("aria-label", T.done ? "发送" : "停止");
    $("#composerPh").textContent = T.done ? "继续交代下一件事…" : "补充说明或调整方向…";
  },
  create(k, vis) {
    const n = document.createElement(k.startsWith("row-") ? "button" : "div");
    n.dataset.k = k;
    if (k.startsWith("row-")) {
      const id = k.slice(4); n.type = "button"; n.className = "t-row"; n.id = k;
      n.innerHTML = `<span class="t-ico"></span><span class="t-name"><span class="v"></span><span class="o"></span></span><span class="t-res"></span><span class="t-time"></span><span class="t-chev">${ico("chev", "s14")}</span>`;
      n.onclick = () => CONV.activate(id);
      n.onkeydown = ev => { if (ev.key === "Escape" && T.open === id && !ev.isComposing) { T.open = null; CONV.sync(); n.focus(); ev.preventDefault(); } };
    } else if (k.startsWith("det-")) { n.className = "t-detail"; n.id = k; n.setAttribute("role", "region"); }
    else if (k.startsWith("dec-")) { n.className = "t-decide"; n.id = k; }
    else if (k === "ent-more" || k === "ent-less") { n.className = "t-narr"; n.style.margin = "2px 8px 2px 28px"; }
    else { const e = T.entries.find(x => "ent-" + x.id === k); n.className = e?.t === "think" ? "t-think" : "t-narr"; }
    return n;
  },
  refresh(k, n, vis) {
    if (k.startsWith("row-")) return this.updateAct(k.slice(4));
    if (k.startsWith("det-")) return this.fillDetail(n, T.acts.get(k.slice(4)));
    if (k.startsWith("dec-")) return this.fillDecision(n);
    if (k === "ent-more") { n.innerHTML = `<button class="lnk" type="button">${ico("chevd", "s14")}展开其余 ${vis.hidden} 项一般记录</button>`; n.firstChild.onclick = () => { T.showAll = true; CONV.sync(); }; return; }
    if (k === "ent-less") { n.innerHTML = `<button class="lnk" type="button">收起一般记录</button>`; n.firstChild.onclick = () => { T.showAll = false; CONV.sync(); }; return; }
    const e = T.entries.find(x => "ent-" + x.id === k);
    if (e?.t === "narr") { if (n.textContent !== e.text) n.textContent = e.text; }
    if (e?.t === "think") this.updateThink(e, n);
  },
  updateThink(e, n = $("#ent-" + e.id) || $$("[data-k='ent-" + e.id + "']")[0]) {
    if (!n) return;
    const live = !e.end, el = (e.end ?? ENG.now) - e.start;
    const pub = UI.reason === "public" && e.summary.length;
    const label = live ? `正在思考 · ${fmtDur(el)}` : `思考 ${fmtDur(el)}`;
    const sig = label + (pub ? 1 : 0) + e.open + live;
    if (n._sig === sig) return; n._sig = sig;
    n.innerHTML = `<span class="t-ico">${live ? '<span class="spin"></span>' : ico("think", "s14")}</span>` +
      (pub ? `<button type="button" aria-expanded="${e.open}">${esc(label)}${ico(e.open ? "chevd" : "chev", "s12")}</button>` : `<span>${esc(label)}${UI.reason === "private" && T.entries.find(x => x.t === "think") === e ? '<span style="color:var(--ink-4)"> · 推理内容不公开</span>' : ""}</span>`) + `<span></span>`;
    if (pub) n.querySelector("button").onclick = () => { e.open = !e.open; n._sig = null; this.updateThink(e, n); };
    let b = n.nextElementSibling?.classList.contains("t-think-body") ? n.nextElementSibling : null;
    if (pub && e.open) { if (!b) { b = document.createElement("div"); b.className = "t-think-body"; n.after(b); } b.innerHTML = e.summary.map(s => `<div>${esc(s)}</div>`).join(""); }
    else if (b) b.remove();
  },
  activate(id) {
    if (UI.panelOpen) { T.selected = T.selected === id && UI.panelTab === "progress" ? null : id; UI.panelTab = "progress"; PANEL.render(true); }
    else T.open = T.open === id ? null : id;
    CONV.sync();
  },
  updateAct(id) {
    const a = T.acts.get(id), n = document.getElementById("row-" + id); if (!a || !n) return;
    const k = KIND[a.kind], st = ST[a.status];
    const verb = a.kind === "agent" ? "子代理" : k.verb;
    const res = a.status === "ok" ? (a.result?.text || "") : (a.status === "running" && a.result?.text) ? a.result.text : (a.result?.text && a.status !== "waiting" ? a.result.text : st.word);
    const glyph = st.glyph === "spin" ? '<span class="spin" aria-hidden="true"></span>' : st.glyph ? ico(st.glyph, "s14") : "";
    const dur = ["denied", "notrun", "waiting", "queued"].includes(a.status) ? "—" : a.end ? fmtDur(a.end - a.start) : a.status === "running" ? fmtDur(ENG.now - a.start) : "—";
    const par = a.par ? [...T.acts.values()].filter(x => x.par === a.par) : [];
    const sig = [a.status, res, dur, T.selected === id, T.open === id, a.attempt, par.length].join("|");
    if (n._sig === sig) return; n._sig = sig;
    n.querySelector(".t-ico").innerHTML = ico(k.icon);
    n.querySelector(".v").textContent = verb + (a.attempt > 1 ? `（第 ${a.attempt} 次）` : "");
    const o = n.querySelector(".o"); o.textContent = a.obj; o.className = "o" + (a.code ? " code" : ""); o.title = a.obj;
    const r = n.querySelector(".t-res"); r.className = "t-res " + (a.status === "ok" ? "" : st.cls);
    r.innerHTML = glyph + `<span class="val ${a.result?.n && a.status === "ok" ? "n" : ""}">${esc(res)}</span>`;
    n.querySelector(".t-time").textContent = dur;
    n.classList.toggle("running", a.status === "running");
    n.classList.toggle("selected", T.selected === id && UI.panelOpen);
    n.setAttribute("aria-expanded", String(T.open === id && !UI.panelOpen));
    n.setAttribute("aria-controls", "det-" + id);
    n.classList.toggle("par", par.length > 1);

      `<button class="btn ghost" type="button" data-c="deny" ${busy ? "disabled" : ""}>拒绝</button></div>`;
    $$("[data-c]", n).forEach(b => b.onclick = () => { if (d.state === "open") resolveDecision(b.dataset.c === "deny" ? "deny" : b.dataset.c === "all" ? "all" : "allow"); });
  },
  headModel() {

    } else {

  updateHead() {

    else if (T.phase === "waiting") txt = "等待模型响应";

    if (n._sig === sig) return; n._sig = sig;

  updateMeta() {

/* =====================================================================
   7. 定时计划 · 节律（原创重设计，字段严格对应 Hertz.Contracts.SchedulingContracts）
   ===================================================================== */
const NOW = new Date(2026, 9, 12, 10, 30); // 演示基准：2026-10-12 周一 10:30（北京时间）
const DAYN = "日一二三四五六";
const pad = n => String(n).padStart(2, "0");
const ymd = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const parseD = (s, t = "00:00") => { const [y, m, d] = s.split("-").map(Number); const [hh, mm] = t.split(":").map(Number); return new Date(y, m - 1, d, hh, mm); };
const md = d => `${d.getMonth() + 1}月${d.getDate()}日`;
const hm = d => `${pad(d.getHours())}:${pad(d.getMinutes())}`;
const sameDay = (a, b) => ymd(a) === ymd(b);
function relDay(d) {
  const a = new Date(NOW.getFullYear(), NOW.getMonth(), NOW.getDate()), b = new Date(d.getFullYear(), d.getMonth(), d.getDate());
  const diff = Math.round((b - a) / 864e5);
  if (diff === 0) return "今天"; if (diff === 1) return "明天"; if (diff === -1) return "昨天";
  if (diff > 1 && diff < 7) return "周" + DAYN[d.getDay()];
  return md(d);
}

<div class="motion-demo"><button class="btn secondary" type="button" id="demoBeat">演示心跳点</button><span class="beat" id="demoBeatDot"></span><span class="spin"></span><span style="font-size:12px;color:var(--ink-3)">运行环 1 s / 圈</span></div>
<p>禁止：发光、渐变流动、雷达扫描、呼吸灯、骨架闪光条、对行高做动画、对每个 token 做动画。</p>

<h3 id="sp11">12. 交互规则</h3>
<ul>
<li>默认展开：回合进行中展开；结束后操作 >6 自动收起（用户操作过则保持用户选择）。</li>
<li>可见名额：展开时 ≤8 项全部显示；>8 项只隐藏一般成功项并保留最近 4 项；思考、旁白、计划不占名额。</li>
<li>任何时刻同一回合只有一项原位展开；面板打开时不原位展开。</li>
<li>结果同位更新：运行中结果列显示进度事实，结束后原位替换，不新增行；列宽不随内容变化。</li>
<li>读到底部才自动跟随滚动；用户上滚后只显示"回到最新"，不抢滚动、不清选区、不自动收起正在阅读的详情。</li>
<li>重试：每次尝试独立一行并标注"第 N 次"；副作用未知的操作只允许"同步状态"，不提供重试。</li>
<li>停止：前台两阶段（正在停止 → 已停止）；后台任务需单独停止。</li>
<li>定时计划：点击行 = 选中；双击或 Enter = 打开详情（宽屏已显示）；过期单次只能改期；所有写操作等 Host 回执后才改变状态，期间显示"正在…"。</li>
</ul>

<h3 id="sp12">13. 响应式与 Windows DPI</h3>
<table class="tbl"><thead><tr><th>窗口（DIP）</th><th>对话</th><th>定时计划</th></tr></thead><tbody>
<tr><td>≥1280</td><td>侧栏 236；阅读列 ≤760；面板 400</td><td>列表 + 右侧详情 360</td></tr>
<tr><td>1024</td><td>侧栏收为 64 图标列；面板 360</td><td>单列，详情内联</td></tr>
<tr><td>≤760</td><td>无侧栏；取消悬挂；面板覆盖全宽</td><td>单列，右列时间可换行</td></tr>
</tbody></table>
<ul><li>所有尺寸为 DIP；Avalonia 中直接写 DIP 数值，开启 UseLayoutRounding；不得按物理像素换算后写死。</li>
<li>必须在 100/125/150/200% 系统缩放与跨 DPI 显示器拖动时验证：1 px 分隔线保持 1 物理像素（使用 0.5/1 DIP 对齐规则由框架取整，不手动偏移）。</li>
<li>文字缩放（应用设置）≥150% 时图标 ×1.25；断点按"窗口宽 ÷ 文字缩放"判断。</li></ul>

<h3 id="sp13">14. 无障碍</h3>
<ul><li>操作行名称：动词，对象，结果，耗时，展开状态（只拼接非空字段）；标题行：标题，元信息，耗时，展开状态。</li>
<li>回收或尚未绑定数据的容器不得出现在无障碍树中（IsVisible=false 或 AccessibilityView=Raw）。</li>
<li>决策区为 Group，名称为标题；按钮名称包含对象（"允许这一次：写入 Desktop\\23hertz-approval-test.txt"）。</li>
<li>现在行为 status（polite），只在阶段变化时更新名称，计时不进入名称。</li>
<li>对比度见令牌表；高对比模式下允许系统颜色接管文字、边框与焦点。</li></ul>

<h3 id="sp14">15. 验收标准</h3>
<p>与《施工规格》§H、《Codex 提示词》第五节同号同文。每项必须有真实 Windows 客户端证据；原型检查不能替代。</p>

`;
    $("#klToggle").onclick = () => $("#iconGrid").parentElement.classList.toggle("show-keylines");
    $("#demoBeat").onclick = () => { const d = $("#demoBeatDot"); d.classList.add("on"); setTimeout(() => d.classList.remove("on"), 90); };
  },

/* =====================================================================
   9. 初始化与原型控制
   ===================================================================== */
function applyTextScale(v) {
  const w = $("#win"); w.style.setProperty("--text-scale", v);
  const k = Math.min(+v, 1.25), big = +v >= 1.5 ? 1.25 : 1;
  w.style.setProperty("--icon", 16 * big + "px"); w.style.setProperty("--icon-slot", 18 * big + "px"); w.style.setProperty("--hang", 18 * big + 10 + "px");
  void k;
}
function init() {
  const sel = $("#pScenario"); sel.innerHTML = Object.entries(SCENARIOS).map(([k, s]) => `<option value="${k}">${esc(s.name)}</option>`).join("");
  sel.onchange = () => loadScenario(sel.value);
  $$(".proto-bar [data-view]").forEach(b => b.onclick = () => setView(b.dataset.view));
  $$(".nav [data-nav]").forEach(b => b.onclick = () => { const v = b.dataset.nav; if (v === "conv" || v === "sch" || v === "spec") setView(v); else toast("演示：沿用现有页面"); });
  $("#pPlay").onclick = () => { ENG.playing = !ENG.playing; $("#pPlay").textContent = ENG.playing ? "暂停" : "播放"; $("#pPlay").setAttribute("aria-pressed", String(ENG.playing)); };
  $("#pStep").onclick = () => { ENG.playing = false; $("#pPlay").textContent = "播放"; tick(Math.max(300, ENG.wait + 1)); };
  $("#pReset").onclick = () => loadScenario(ENG.key);
  $("#pSpeed").onchange = e => ENG.speed = +e.target.value;
  $("#pReason").onchange = e => { UI.reason = e.target.value; loadScenario(ENG.key); };
  $("#pSchState").onchange = e => { SCH.state = e.target.value; setView("sch"); };
  $("#pWidth").onchange = e => { $("#win").dataset.w = e.target.value; if (UI.view === "sch") SCH.render(); CONV.sync(); };
  $("#pText").onchange = e => { applyTextScale(e.target.value); CONV.sync(); if (UI.view === "sch") SCH.render(); };
  $("#pTheme").onclick = () => { const dark = document.documentElement.dataset.theme !== "dark"; document.documentElement.dataset.theme = dark ? "dark" : "light"; $("#pTheme").setAttribute("aria-pressed", String(dark)); if (UI.view === "spec") SPEC.render(); };
  $("#pMotion").onclick = () => { const on = document.documentElement.dataset.motion !== "reduce"; document.documentElement.dataset.motion = on ? "reduce" : ""; $("#pMotion").setAttribute("aria-pressed", String(on)); };
  $$("#view-conv [data-ptab]").forEach(b => b.onclick = () => { const t = b.dataset.ptab; if (UI.panelOpen && UI.panelTab === t) UI.panelOpen = false; else { UI.panelOpen = true; UI.panelTab = t; if (T.open) { T.selected = T.open; T.open = null; } } PANEL.render(true); CONV.sync(); });
  $("#sendBtn").onclick = () => { if (T && !T.done) requestStop(); else toast("演示：输入框沿用现有实现"); };
  $("#scrim").onclick = () => { if ($("#dlg").classList.contains("on")) return; SCH.closeEditor(); };
  document.addEventListener("keydown", e => {
    if (e.ctrlKey && e.key === ".") { e.preventDefault(); $("#panelBtn").click(); }
    if (e.key === "Escape" && !e.isComposing) {
      if (SCH.pop && !$("#drawer").classList.contains("on")) { const a = SCH.pop.anchor; SCH.closePop(); a?.focus?.(); return; }
      const det = e.target.closest?.(".t-detail");
      if (det && T) { const id = det.id.slice(4); T.open = null; CONV.sync(); document.getElementById("row-" + id)?.focus(); }
    }
  });
  setView("conv"); loadScenario("standard");
  ENG.timer = setInterval(() => { if (ENG.playing) tick(50 * ENG.speed); }, 50);
}
init();
</script>
